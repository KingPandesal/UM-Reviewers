      const map = {
        indigo: "bg-indigo-100 text-indigo-800 border-indigo-200",
        emerald: "bg-emerald-100 text-emerald-800 border-emerald-200",
        amber: "bg-amber-100 text-amber-800 border-amber-200",
        rose: "bg-rose-100 text-rose-800 border-rose-200",
        purple: "bg-purple-100 text-purple-800 border-purple-200",
        slate: "bg-slate-200 text-slate-800 border-slate-300"
      };
      return map[color] || map.indigo;
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderBlock(block) {
      if (block.type === "paragraph") {
        return `<p class="text-sm sm:text-[15px] text-slate-700 leading-relaxed searchable-text">${escapeHTML(block.text)}</p>`;
      }

      if (block.type === "subheading") {
        return `<h3 class="text-sm sm:text-base font-bold text-slate-900 pt-2 flex items-center gap-2 searchable-text">
          <span class="w-1.5 h-4 rounded-full bg-indigo-500 inline-block"></span>
          ${escapeHTML(block.text)}
        </h3>`;
      }

      if (block.type === "bullets") {
        const lis = block.items.map(item => {
          let contentHtml = escapeHTML(item);
          if (block.blurParts) {
            const idx = item.indexOf(".");
            if (idx > 0 && idx < item.length - 5) {
              const head = escapeHTML(item.slice(0, idx + 1));
              const tail = escapeHTML(item.slice(idx + 1));
              contentHtml = `<strong class="text-slate-900">${head}</strong><span class="recall-target" title="Click to reveal">${tail}</span>`;
            }
          } else {
            const colonIdx = item.indexOf(":");
            if (colonIdx > 0 && colonIdx < 48) {
              const head = escapeHTML(item.slice(0, colonIdx + 1));
              const tail = escapeHTML(item.slice(colonIdx + 1));
              contentHtml = `<strong class="text-slate-900">${head}</strong><span class="recall-target" title="Click to reveal">${tail}</span>`;
            }
          }
          return `<li class="flex items-start gap-2.5 text-sm sm:text-[15px] text-slate-700 leading-relaxed searchable-text">
            <span class="mt-2 w-1.5 h-1.5 rounded-full bg-slate-400 shrink-0"></span>
            <span>${contentHtml}</span>
          </li>`;
        }).join("");
        return `<ul class="space-y-2.5 pl-1">${lis}</ul>`;
      }

      if (block.type === "numbered") {
        const lis = block.items.map((item, i) => {
          const colonIdx = item.indexOf(":");
          let contentHtml = escapeHTML(item);
          if (colonIdx > 0 && colonIdx < 40) {
            contentHtml = `<strong class="text-slate-900">${escapeHTML(item.slice(0, colonIdx + 1))}</strong><span class="recall-target" title="Click to reveal">${escapeHTML(item.slice(colonIdx + 1))}</span>`;
          }
          return `<li class="flex items-start gap-3 text-sm sm:text-[15px] text-slate-700 leading-relaxed searchable-text">
            <span class="mt-0.5 w-6 h-6 rounded-lg bg-slate-100 border border-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center shrink-0">${i + 1}.</span>
            <span>${contentHtml}</span>
          </li>`;
        }).join("");
        return `<ol class="space-y-2.5">${lis}</ol>`;
      }

      if (block.type === "steps") {
        const sub = block.subtitle ? `<p class="text-xs sm:text-sm text-slate-600 mb-3 searchable-text">${escapeHTML(block.subtitle)}</p>` : "";
        const itemsHtml = block.items.map((item, idx) => {
          const dotIdx = item.indexOf(".");
          let textHtml = escapeHTML(item);
          if (dotIdx > 0 && dotIdx < 65) {
            textHtml = `<strong class="text-slate-900">${escapeHTML(item.slice(0, dotIdx + 1))}</strong><span class="recall-target" title="Click to reveal">${escapeHTML(item.slice(dotIdx + 1))}</span>`;
          }
          return `<li class="flex items-start gap-3 p-3 rounded-xl border border-slate-200/80 bg-slate-50/70">
            <span class="mt-0.5 min-w-[2.1rem] h-6 px-1.5 rounded-lg bg-indigo-50 border border-indigo-200 text-indigo-700 font-mono font-bold text-xs flex items-center justify-center shrink-0">${idx + 1}.</span>
            <div class="text-sm sm:text-[15px] leading-relaxed text-slate-800 searchable-text">${textHtml}</div>
          </li>`;
        }).join("");

        return `<div class="block-steps rounded-2xl border border-slate-200 bg-white p-4 sm:p-5 space-y-2.5">
          <div class="flex items-center justify-between gap-2 pb-1">
            <h4 class="text-sm sm:text-base font-bold text-slate-900 searchable-text">${escapeHTML(block.title)}</h4>
            <span class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-200 shrink-0">Steps (${block.items.length})</span>
          </div>
          ${sub}
          <ol class="space-y-2">${itemsHtml}</ol>
        </div>`;
      }

      if (block.type === "table") {
        const ths = block.headers.map(h => `<th class="px-3.5 py-2.5 text-left text-xs font-bold uppercase tracking-wider text-slate-700 bg-slate-100/90 border-b border-slate-200 searchable-text">${escapeHTML(h)}</th>`).join("");
        const trs = block.rows.map(row => {
          const tds = row.map((cell, cIdx) => {
            const isBlur = block.blurCol === cIdx;
            const inner = isBlur
              ? `<span class="recall-target" title="Click to reveal exact definition">${escapeHTML(cell)}</span>`
              : escapeHTML(cell);
            return `<td class="px-3.5 py-2.5 text-xs sm:text-sm text-slate-700 border-b border-slate-100 align-top leading-relaxed ${cIdx === 0 ? "font-semibold text-slate-900" : ""} searchable-text">${inner}</td>`;
          }).join("");
          return `<tr class="hover:bg-indigo-50/30 transition">${tds}</tr>`;
        }).join("");

        return `<div class="block-table overflow-x-auto rounded-2xl border border-slate-200 shadow-2xs">
          <table class="min-w-full divide-y divide-slate-200 bg-white">
            <thead><tr>${ths}</tr></thead>
            <tbody class="divide-y divide-slate-100">${trs}</tbody>
          </table>
        </div>`;
      }

      if (block.type === "callout") {
        const styles = {
          indigo: "bg-indigo-50/80 border-indigo-200 text-indigo-950",
          amber: "bg-amber-50/90 border-amber-200 text-amber-950",
          rose: "bg-rose-50/90 border-rose-200 text-rose-950"
        };
        const titleColors = {
          indigo: "text-indigo-800",
          amber: "text-amber-800",
          rose: "text-rose-800"
        };
        return `<div class="rounded-2xl border p-4 ${styles[block.variant] || styles.indigo}">
          <p class="text-xs sm:text-sm font-extrabold uppercase tracking-wide mb-1 ${titleColors[block.variant] || titleColors.indigo} searchable-text">${escapeHTML(block.title)}</p>
          <p class="text-xs sm:text-sm leading-relaxed searchable-text">${escapeHTML(block.text)}</p>
        </div>`;
      }

      if (block.type === "twocol") {
        const leftLis = block.leftItems.map(i => `<li class="flex items-start gap-2 text-xs sm:text-sm text-slate-700 searchable-text"><span class="text-emerald-600 font-bold">•</span><span>${escapeHTML(i)}</span></li>`).join("");
        const rightLis = block.rightItems.map(i => `<li class="flex items-start gap-2 text-xs sm:text-sm text-slate-700 searchable-text"><span class="text-indigo-600 font-bold">•</span><span>${escapeHTML(i)}</span></li>`).join("");
        return `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="rounded-2xl border border-emerald-200 bg-emerald-50/40 p-4">
            <h4 class="text-sm font-bold text-emerald-900 mb-2 searchable-text">${escapeHTML(block.leftTitle)}</h4>
            <ul class="space-y-1.5">${leftLis}</ul>
          </div>
          <div class="rounded-2xl border border-indigo-200 bg-indigo-50/40 p-4">
            <h4 class="text-sm font-bold text-indigo-900 mb-2 searchable-text">${escapeHTML(block.rightTitle)}</h4>
            <ul class="space-y-1.5">${rightLis}</ul>
          </div>
        </div>`;
      }

      if (block.type === "code") {
        return `<div class="relative rounded-2xl bg-slate-900 text-slate-100 p-4 overflow-x-auto border border-slate-800">
          <button type="button" class="copy-code-btn absolute top-3 right-3 px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-semibold text-slate-300 border border-slate-700">Copy</button>
          <pre class="font-mono text-xs sm:text-[13px] leading-relaxed whitespace-pre searchable-text">${escapeHTML(block.code)}</pre>
        </div>`;
      }

      if (block.type === "activity") {
        const items = block.items.map(i => `<p class="text-xs sm:text-sm text-slate-700 leading-relaxed searchable-text">${escapeHTML(i)}</p>`).join("");
        const foot = block.footer ? `<p class="mt-2 pt-2 border-t border-purple-200/80 text-xs font-semibold text-purple-900 searchable-text">${escapeHTML(block.footer)}</p>` : "";
        return `<div class="rounded-2xl border border-purple-200 bg-purple-50/50 p-4 sm:p-5 space-y-1.5">
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 rounded-md bg-purple-600 text-white text-[10px] font-bold uppercase tracking-wider">Lab Activity</span>
            <h4 class="text-sm font-bold text-purple-950 searchable-text">${escapeHTML(block.title)}</h4>
          </div>
          ${items}
          ${foot}
        </div>`;
      }

      if (block.type === "review_qs") {
        const qs = block.items.map((item) => `
          <div class="rounded-2xl border border-slate-200 bg-slate-50/60 overflow-hidden">
            <button type="button" class="toggle-answer-btn w-full text-left p-4 flex items-start justify-between gap-3 hover:bg-white transition">
              <div class="space-y-1">
                <span class="inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">${escapeHTML(item.mod)}</span>
                <p class="text-sm sm:text-[15px] font-bold text-slate-900 searchable-text">${escapeHTML(item.q)}</p>
              </div>
              <span class="shrink-0 px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs font-semibold">Show answer</span>
            </button>
            <div class="review-answer hidden px-4 pb-4 pt-2 bg-emerald-50/70 border-t border-emerald-200/80 text-xs sm:text-sm text-emerald-950 leading-relaxed searchable-text">
              <strong class="text-emerald-800">Answer:</strong> ${escapeHTML(item.a)}
            </div>
          </div>
        `).join("");
        return `<div class="space-y-3">${qs}</div>`;
      }

      return "";
    }

    function renderAllContent() {
      const root = document.getElementById("verbatimContentRoot");
      let html = "";

      STUDY_SECTIONS.forEach(sec => {
        const hasSteps = sec.blocks.some(b => b.type === "steps");
        const hasTables = sec.blocks.some(b => b.type === "table");
        const blocksHtml = sec.blocks.map(renderBlock).join("\n");

        html += `
          <article id="${sec.id}" data-module="${sec.module}" data-has-steps="${hasSteps}" data-has-tables="${hasTables}" class="study-card rounded-3xl bg-white border border-slate-200 shadow-xs p-5 sm:p-7 space-y-5">
            <div class="pb-3 border-b border-slate-100 space-y-1.5">
              <div class="flex flex-wrap items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold border ${getBadgeClasses(sec.badgeColor)}">${escapeHTML(sec.moduleBadge)}</span>
                <span class="text-xs font-mono text-slate-400">${escapeHTML(sec.pageRef)}</span>
                ${hasSteps ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">Steps</span>` : ""}
                ${hasTables ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-sky-50 text-sky-700 border border-sky-200">Table</span>` : ""}
              </div>
              <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight searchable-text">${escapeHTML(sec.title)}</h2>
            </div>

            <div class="space-y-4">
              ${blocksHtml}
            </div>
          </article>`;
      });

      root.innerHTML = html;
    }

    // =========================================================================
    // INTERACTIVE EVENT LISTENERS
    // =========================================================================
    document.addEventListener("click", (e) => {
      // Reveal blurred recall target
      const recallEl = e.target.closest(".recall-target");
      if (recallEl && document.body.classList.contains("recall-mode")) {
        recallEl.classList.toggle("revealed");
        return;
      }

      // Review Question Show/Hide Answer
      const ansBtn = e.target.closest(".toggle-answer-btn");
      if (ansBtn) {
        const ansBox = ansBtn.nextElementSibling;
        const badge = ansBtn.querySelector("span:last-child");
        const isHidden = ansBox.classList.contains("hidden");
        ansBox.classList.toggle("hidden");
        badge.textContent = isHidden ? "Hide answer" : "Show answer";
        badge.classList.toggle("bg-indigo-600", !isHidden);
        badge.classList.toggle("bg-slate-700", isHidden);
        return;
      }

      // Copy CLI code block using execCommand fallback
      const copyBtn = e.target.closest(".copy-code-btn");
      if (copyBtn) {
        const codeText = copyBtn.nextElementSibling.textContent;
        const ta = document.createElement("textarea");
        ta.value = codeText;
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          showToast("Commands copied to clipboard!");
        } catch (err) {
          showToast("Unable to copy automatically");
        }
        document.body.removeChild(ta);
        return;
      }
    });

    // Blur Recall Mode Toggle
    document.getElementById("toggleRecallBtn").addEventListener("click", function () {
      document.body.classList.toggle("recall-mode");
      const active = document.body.classList.contains("recall-mode");
      document.querySelectorAll(".recall-target").forEach(el => el.classList.remove("revealed"));
      this.classList.toggle("bg-amber-100", active);
      this.classList.toggle("border-amber-400", active);
      showToast(active ? "Blur Recall ON — tap blurred text to reveal" : "Blur Recall OFF");
    });

    // Module & Dedicated Category Filter Pills
    function resetFilterBtnStyles() {
      document.querySelectorAll(".mod-filter-btn").forEach(b => {
        const f = b.getAttribute("data-mod-filter");
        b.classList.remove("bg-indigo-600", "bg-emerald-600", "bg-sky-600", "text-white", "border-emerald-600", "border-sky-600");
        if (f === "steps") {
          b.classList.add("bg-emerald-50", "text-emerald-800", "border-emerald-200");
        } else if (f === "tables") {
          b.classList.add("bg-sky-50", "text-sky-800", "border-sky-200");
        } else {
          b.classList.add("bg-slate-100", "text-slate-700");
        }
      });
    }

    document.querySelectorAll(".mod-filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeModFilter = btn.getAttribute("data-mod-filter");
        resetFilterBtnStyles();

        if (activeModFilter === "steps") {
          btn.classList.remove("bg-emerald-50", "text-emerald-800", "border-emerald-200");
          btn.classList.add("bg-emerald-600", "text-white", "border-emerald-600");
        } else if (activeModFilter === "tables") {
          btn.classList.remove("bg-sky-50", "text-sky-800", "border-sky-200");
          btn.classList.add("bg-sky-600", "text-white", "border-sky-600");
        } else {
          btn.classList.remove("bg-slate-100", "text-slate-700");
          btn.classList.add("bg-indigo-600", "text-white");
        }

        applyFiltersAndSearch();
      });
    });

    // Search & Filter Logic
    const searchInput = document.getElementById("searchInput");
    const searchCount = document.getElementById("searchCount");

    function clearHighlights() {
      document.querySelectorAll("mark.search-hit").forEach(mark => {
        const parent = mark.parentNode;
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize();
      });
    }

    function highlightTextNodes(el, query) {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) nodes.push(n);
      let hits = 0;
      const lowerQ = query.toLowerCase();

      nodes.forEach(textNode => {
        const val = textNode.nodeValue;
        const idx = val.toLowerCase().indexOf(lowerQ);
        if (idx !== -1) {
          const span = document.createElement("span");
          let last = 0;
          let pos = idx;
          while (pos !== -1) {
            span.appendChild(document.createTextNode(val.slice(last, pos)));
            const mark = document.createElement("mark");
            mark.className = "search-hit";
            mark.textContent = val.slice(pos, pos + query.length);
            span.appendChild(mark);
            hits++;
            last = pos + query.length;
            pos = val.toLowerCase().indexOf(lowerQ, last);
          }
          span.appendChild(document.createTextNode(val.slice(last)));
          textNode.parentNode.replaceChild(span, textNode);
        }
      });
      return hits;
    }

    function applyFiltersAndSearch() {
      clearHighlights();
      const q = searchInput.value.trim();
      let visibleCards = 0;
      let totalHits = 0;

      document.querySelectorAll(".study-card").forEach(card => {
        const mod = card.getAttribute("data-module");
        const hasSteps = card.getAttribute("data-has-steps") === "true";
        const hasTables = card.getAttribute("data-has-tables") === "true";

        let modMatch = false;
        if (activeModFilter === "all") {
          modMatch = true;
        } else if (activeModFilter === "steps") {
          modMatch = hasSteps;
        } else if (activeModFilter === "tables") {
          modMatch = hasTables;
        } else {
          modMatch = mod === activeModFilter;
        }

        const textMatch = !q || card.textContent.toLowerCase().includes(q.toLowerCase());

        if (modMatch && textMatch) {
          card.classList.remove("hidden");
          visibleCards++;
          if (q) {
            totalHits += highlightTextNodes(card, q);
          }
        } else {
          card.classList.add("hidden");
        }
      });

      if (q) {
        searchCount.textContent = `${totalHits} hits`;
        searchCount.classList.remove("hidden");
      } else {
        searchCount.classList.add("hidden");
      }

      document.getElementById("noSearchResults").classList.toggle("hidden", visibleCards > 0);
    }

    searchInput.addEventListener("input", applyFiltersAndSearch);
    document.getElementById("clearSearchBtn").addEventListener("click", () => {
      searchInput.value = "";
      activeModFilter = "all";
      document.querySelector('.mod-filter-btn[data-mod-filter="all"]').click();
    });

    // Initial Render
    renderAllContent();
  </script>
</body>
</html>
